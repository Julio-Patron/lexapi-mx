name: CI

# Instala el SDK y el servidor MCP tal como se publican y corre sus pruebas.

on:
  pull_request:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.12"
      - run: uv venv
      # --no-sources: el servidor MCP declara el SDK como miembro del workspace privado.
      - run: uv pip install --no-sources ./packages/lex-api-client ./packages/lex-mcp-server pytest
      - run: uv run --no-project pytest -q tests
