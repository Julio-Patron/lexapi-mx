[project]
name = "lex-api-mx-mcp"
version = "0.3.1"
description = "Servidor MCP de Lex API MX: legislación mexicana vigente y verificable para agentes de IA"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Lex API MX", email = "admin@lexapi.mx" }]
requires-python = ">=3.11"
keywords = ["mcp", "model-context-protocol", "mexico", "legislacion", "leyes", "legal", "ai-agents"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Natural Language :: Spanish",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "lex-api-mx-client>=0.3.1,<0.4",
    "mcp>=2.2,<3",
]

[project.urls]
Homepage = "https://lexapi.mx"
Documentation = "https://lexapi.mx/docs"
Repository = "https://github.com/Julio-Patron/lexapi-mx"

[project.scripts]
lex-api-mx-mcp = "lex_api_mx_mcp.server:main"

[tool.uv.sources]
lex-api-mx-client = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lex_api_mx_mcp"]
